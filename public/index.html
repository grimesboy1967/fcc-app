<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family Financial Command Center</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 40px 36px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 20px 60px rgba(0,0,0,.4);
  }
  .logo { text-align: center; margin-bottom: 32px; }
  .logo h1 { font-size: 28px; color: #0f172a; font-weight: 800; }
  .logo p { color: #64748b; font-size: 13px; margin-top: 6px; }
  .logo .icon { font-size: 48px; display: block; margin-bottom: 12px; }

  label { display: block; font-size: 12px; font-weight: 600; color: #374151; margin-bottom: 6px; text-transform: uppercase; letter-spacing: .05em; }
  input[type=email], input[type=password] {
    width: 100%; padding: 12px 14px; border: 1.5px solid #e2e8f0; border-radius: 8px;
    font-size: 15px; color: #0f172a; outline: none; transition: border-color .15s;
    margin-bottom: 16px;
  }
  input:focus { border-color: #3b82f6; }

  .btn {
    width: 100%; padding: 13px; background: #2563eb; color: #fff;
    border: none; border-radius: 8px; font-size: 15px; font-weight: 600;
    cursor: pointer; transition: background .15s;
  }
  .btn:hover:not(:disabled) { background: #1d4ed8; }
  .btn:disabled { opacity: .6; cursor: not-allowed; }
  .btn-outline {
    background: transparent; border: 1.5px solid #e2e8f0; color: #374151; margin-top: 8px;
  }
  .btn-outline:hover:not(:disabled) { background: #f8fafc; }

  .divider { text-align: center; color: #94a3b8; font-size: 13px; margin: 16px 0; }
  .error { color: #ef4444; font-size: 13px; margin-top: 12px; text-align: center; min-height: 20px; }
  .success { color: #16a34a; font-size: 13px; margin-top: 12px; text-align: center; }
  .tab-row { display: flex; gap: 8px; margin-bottom: 24px; }
  .tab {
    flex: 1; padding: 9px; border: 1.5px solid #e2e8f0; border-radius: 8px;
    font-size: 13px; font-weight: 600; cursor: pointer; text-align: center;
    background: #f8fafc; color: #64748b; transition: all .15s;
  }
  .tab.active { background: #eff6ff; border-color: #3b82f6; color: #1d4ed8; }

  #forgot-link { display: block; text-align: right; font-size: 12px; color: #3b82f6; cursor: pointer; margin-top: -10px; margin-bottom: 16px; text-decoration: none; }
  #forgot-link:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="card">
  <div class="logo">
    <span class="icon">💰</span>
    <h1>Financial Command Center</h1>
    <p>Robertson Family · Private &amp; Secure</p>
  </div>

  <!-- Tab row -->
  <div class="tab-row">
    <div class="tab active" id="tab-signin" onclick="switchTab('signin')">Sign In</div>
    <div class="tab"        id="tab-signup" onclick="switchTab('signup')">Create Account</div>
  </div>

  <!-- Sign In form -->
  <form id="form-signin" onsubmit="doSignIn(event)">
    <label for="si-email">Email</label>
    <input id="si-email" type="email" placeholder="you@example.com" autocomplete="email" required>

    <label for="si-password">Password</label>
    <input id="si-password" type="password" placeholder="••••••••" autocomplete="current-password" required>
    <a id="forgot-link" onclick="doForgot()">Forgot password?</a>

    <button class="btn" type="submit" id="btn-signin">Sign In →</button>
  </form>

  <!-- Sign Up form (hidden by default) -->
  <form id="form-signup" style="display:none" onsubmit="doSignUp(event)">
    <label for="su-email">Email</label>
    <input id="su-email" type="email" placeholder="you@example.com" autocomplete="email" required>

    <label for="su-password">Password</label>
    <input id="su-password" type="password" placeholder="At least 8 characters" autocomplete="new-password" required minlength="8">

    <button class="btn" type="submit" id="btn-signup">Create Account →</button>
  </form>

  <div class="error" id="error-msg"></div>
  <div class="success" id="success-msg"></div>
</div>

<script>
const SUPABASE_URL      = 'https://pvlcnnnjjlcbwfptujqi.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB2bGNubm5qamxjYndmcHR1anFpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0NDcyNTAsImV4cCI6MjA5NTAyMzI1MH0.6wD7ks265B61xWxQSz-SFzHPOqZX2e39ugOcdrC_xCM';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Already logged in?
sb.auth.getSession().then(({ data: { session } }) => {
  if (session) window.location.href = '/dashboard';
});

function switchTab(tab) {
  document.getElementById('tab-signin').classList.toggle('active', tab === 'signin');
  document.getElementById('tab-signup').classList.toggle('active', tab === 'signup');
  document.getElementById('form-signin').style.display = tab === 'signin' ? '' : 'none';
  document.getElementById('form-signup').style.display = tab === 'signup' ? '' : 'none';
  clearMessages();
}

function clearMessages() {
  document.getElementById('error-msg').textContent   = '';
  document.getElementById('success-msg').textContent = '';
}

function setError(msg)   { clearMessages(); document.getElementById('error-msg').textContent   = msg; }
function setSuccess(msg) { clearMessages(); document.getElementById('success-msg').textContent = msg; }

async function doSignIn(e) {
  e.preventDefault();
  const btn = document.getElementById('btn-signin');
  btn.disabled = true; btn.textContent = 'Signing in…';

  const email    = document.getElementById('si-email').value.trim();
  const password = document.getElementById('si-password').value;

  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) {
    setError(error.message);
    btn.disabled = false; btn.textContent = 'Sign In →';
  } else {
    btn.textContent = '✓ Redirecting…';
    window.location.href = '/dashboard';
  }
}

async function doSignUp(e) {
  e.preventDefault();
  const btn = document.getElementById('btn-signup');
  btn.disabled = true; btn.textContent = 'Creating account…';

  const email    = document.getElementById('su-email').value.trim();
  const password = document.getElementById('su-password').value;

  const { error } = await sb.auth.signUp({ email, password });
  if (error) {
    setError(error.message);
    btn.disabled = false; btn.textContent = 'Create Account →';
  } else {
    // If email confirmation is disabled in Supabase, redirect immediately
    setSuccess('Account created! Redirecting…');
    setTimeout(() => window.location.href = '/dashboard', 1000);
  }
}

async function doForgot() {
  const email = document.getElementById('si-email').value.trim();
  if (!email) { setError('Enter your email first.'); return; }
  const { error } = await sb.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin + '/dashboard'
  });
  if (error) setError(error.message);
  else setSuccess('Password reset email sent — check your inbox.');
}
</script>

</body>
</html>
